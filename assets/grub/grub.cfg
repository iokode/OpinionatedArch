# The boot menu, as decided in docs/decisions/008-grub-boot-policy.md.
#
# This file is installed as /boot/grub/grub.cfg exactly as it is. Nothing
# generates it and nothing edits it: `grub-mkconfig` is not used, because a
# menu that is generated drifts from the one this project designed.
#
# What differs from one machine to the next is not here. The installer writes
# it beside this file, and the first line reads it: the UUID of the encrypted
# container, the microcode image this hardware needs, and whether the splash
# is shown. Everything else is the same on every installation.

source ${prefix}/oparch.cfg

set default=0

# Normal startup goes straight to the message and the passphrase, because the
# pre-boot return message exists to be seen by whoever finds a lost machine,
# and a menu waiting for a keypress shows them a menu instead.
#
# Pressing a key during that second is what asks for the menu. This is the
# hidden timeout doing it, not a modifier being read: `keystatus` needs the
# firmware to report which modifiers are held, and the UEFI console input this
# project boots from does not, so a menu behind Shift would be a menu behind
# nothing.
set timeout_style=hidden
set timeout=1

insmod part_gpt
insmod fat
insmod all_video

menuentry 'OpinionatedArch' {
    linux /vmlinuz-linux cryptdevice=UUID=${root_part_uuid}:cryptroot root=/dev/mapper/cryptroot rootflags=subvol=@ rw ${linux_extra}
    initrd ${ucode_image} /initramfs-linux.img
}

# The recovery system is not built yet — it is pending work in
# docs/remaining.md. The entry keeps its place in the order the policy fixes,
# and says so rather than starting something that is not there: a black screen
# explains nothing, and the order is what an operator learns.
menuentry 'Recovery mode' {
    echo 'The recovery system is not installed on this machine.'
    echo 'Choose OpinionatedArch, or Netboot archiso to boot a live environment.'
    echo ''
    echo 'Returning to the menu...'
    sleep --interruptible 10
}

# Recovering from outside the machine, using the binary the installation left
# on the EFI partition, so a live environment is reachable without a medium.
menuentry 'Netboot archiso' {
    insmod chain
    search --no-floppy --file --set=root /EFI/OpinionatedArch/netbootx64.efi
    chainloader /EFI/OpinionatedArch/netbootx64.efi
}

menuentry 'EFI firmware settings' {
    fwsetup
}

menuentry 'Reboot' {
    reboot
}

menuentry 'Shutdown' {
    halt
}

# Anything the operator's dotfiles put in /boot/grub. The base menu above is
# the project's and is not edited to add to it.
if [ -f ${prefix}/custom.cfg ]; then
    source ${prefix}/custom.cfg
fi
