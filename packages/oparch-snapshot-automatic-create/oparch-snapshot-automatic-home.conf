# A drop-in for user@.service, installed into user@.service.d/. The user
# manager of a work context starts when that work context logs in with no
# session open already, and wants the automatic snapshot of its home, given by
# its UID, and starts after it, so the snapshot holds the home as it was before
# the session.
# Wanting it rather than requiring it is what keeps a snapshot that fails from
# stopping the login.

[Unit]
Wants=oparch-snapshot-automatic-home@%i.service
After=oparch-snapshot-automatic-home@%i.service
