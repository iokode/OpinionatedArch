# What the live system installs from. The project's repository comes first, as
# it does on the published image, because an installation puts the project's
# packages into the target from it.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[oparch]
SigLevel = Required TrustedOnly
Server = https://packages.oparch.iokode.dev

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
