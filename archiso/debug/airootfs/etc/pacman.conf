# What the live system installs from. The repository of the working tree's
# packages, which build.sh puts on the image, comes first: pacman takes a
# package from the first repository that carries its name, so whatever an
# installation asks for that the tree defines comes from the tree. It is not
# signed, and nothing is checked of it, as with the published image's own
# repository. The project's published repository comes next, as it does on the
# published image, for the project's packages the tree does not define.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[oparch-debug]
SigLevel = Never
Server = file:///usr/share/oparch/debug

[oparch]
SigLevel = Required TrustedOnly
Server = https://packages.oparch.iokode.dev

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
